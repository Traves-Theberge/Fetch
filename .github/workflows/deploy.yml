name: deploy
# SAFETY: only push to your branch + manual dispatch. Do NOT add pull_request —
# on a public repo that lets a fork run code on your self-hosted runner.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: [self-hosted, pideploy]
    steps:
      - uses: actions/checkout@v4
      - name: Provision .env from secret
        env:
          DOTENV: ${{ secrets.PIDEPLOY_DOTENV }}
        run: printf '%s' "$DOTENV" > .env
      - run: docker compose up -d --build --remove-orphans
      - run: docker image prune -f
      - name: Remove provisioned .env
        if: always()
        run: rm -f .env
